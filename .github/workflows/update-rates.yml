name: Update FX rates.json

on:
  workflow_dispatch:
  schedule:
    # 每小时跑一次（你也可以改成每 2 小时）
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate rates.json
        run: node scripts/update_rates.mjs

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rates.json
          git diff --staged --quiet || (git commit -m "chore: update rates.json" && git push)
