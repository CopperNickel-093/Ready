<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Excel Web Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, Arial; margin: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 6px 8px; white-space: nowrap; }
    th { background: #f5f5f5; position: sticky; top: 0; }
  </style>
</head>
<body>

<h2>Excel 表格展示</h2>
<div id="output">初始化中…</div>

<!-- ✅ 确定存在的版本 -->
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
(async function () {
  const output = document.getElementById('output');

  try {
    if (typeof XLSX === 'undefined') {
      throw new Error('XLSX 库未加载');
    }

    output.textContent = '正在下载 data.xlsx…';
    const res = await fetch('./data.xlsx?v=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const buf = await res.arrayBuffer();
    output.textContent = `已下载 ${buf.byteLength} bytes，正在解析…`;

    const wb = XLSX.read(buf, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];

    output.innerHTML = XLSX.utils.sheet_to_html(ws);
  } catch (e) {
    output.textContent = '错误：' + e.message;
    console.error(e);
  }
})();
</script>

</body>
</html>
