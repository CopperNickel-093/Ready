<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Ready 助手（V1）</title>
  <style>
    :root{
      --bg:#0b1020; --bg2:#070a14;
      --card: rgba(18,26,51,.92);
      --text:#e8ecff; --muted:#a9b2d6;
      --line: rgba(255,255,255,.10);
      --ok:#6ef2b6; --warn:#ffd27a; --bad:#ff8a8a;
      --btn1:#2b3a75; --btn2:#1e2a55;
      --shadow: 0 10px 30px rgba(0,0,0,.28);
      --radius: 16px;
      --red:#ff3b3b;
      --green:#1fd074;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
      background: linear-gradient(180deg,var(--bg),var(--bg2));
      color:var(--text);
    }
    .container{ max-width:1080px; margin:0 auto; padding:14px; }
    .topbar{
      position:sticky; top:0; z-index:50;
      background:rgba(11,16,32,.78);
      backdrop-filter:blur(10px);
      border-bottom:1px solid var(--line);
    }
    .topbar-inner{
      display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:12px 14px;
      max-width:1080px; margin:0 auto;
      flex-wrap:wrap;
    }

    .author{ display:flex; align-items:center; gap:10px; }
    .avatar{
      width:34px; height:34px; border-radius:50%;
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      overflow:hidden;
      display:flex; align-items:center; justify-content:center;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:none; }
    .avatar .fallback{ font-weight:900; font-size:12px; }
    .author-meta{ display:flex; flex-direction:column; }
    .author-meta .name{ font-weight:900; font-size:13px; }
    .author-meta .tag{ color:var(--muted); font-size:12px; }

    .brand .title{ font-weight:900; font-size:16px; }
    .brand .subtitle{ color:var(--muted); font-size:12px; }

    .btn{
      border:1px solid var(--line);
      background:linear-gradient(180deg,var(--btn1),var(--btn2));
      color:var(--text);
      padding:9px 11px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      font-size:13px;
    }
    .btn.ghost{ background:rgba(255,255,255,.05); }
    .btn.danger{ background:rgba(255,80,80,.14); }

    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:14px;
      margin-top:14px;
    }
    .card h3{ margin:0 0 8px 0; font-size:14px; }

    .grid{
      display:grid;
      grid-template-columns:repeat(12,1fr);
      gap:10px;
      margin-top:10px;
    }
    .field{ grid-column:span 6; display:flex; flex-direction:column; gap:6px; }
    .field.small{ grid-column:span 4; }
    .label{ font-size:12px; color:var(--muted); }
    .input{
      border:1px solid var(--line);
      background:rgba(255,255,255,.06);
      color:var(--text);
      padding:10px;
      border-radius:12px;
      font-size:14px;
    }

    /* toggle */
    .toggle{
      display:flex;
      border:1px solid var(--line);
      border-radius:12px;
      overflow:hidden;
    }
    .toggle button{
      flex:1;
      padding:10px;
      font-weight:900;
      border:0;
      cursor:pointer;
      background:rgba(255,255,255,.05);
      color:#fff;
    }
    .toggle button[data-v="NO"].active{ background:var(--red); }
    .toggle button[data-v="YES"].active{ background:var(--green); }
  </style>
</head>

<body>
<div class="topbar">
  <div class="topbar-inner">
    <div class="author">
      <div class="avatar" id="avatarBox">
        <img id="avatarImg">
        <div class="fallback">CN</div>
      </div>
      <div class="author-meta">
        <div class="name">Copper Nickel</div>
        <div class="tag">Author</div>
      </div>
    </div>

    <div class="brand">
      <div class="title">Ready 助手</div>
      <div class="subtitle">Excel By 药师寺里友儿子网页版</div>
    </div>

    <div>
      <button class="btn ghost">导出</button>
      <button class="btn danger">重置</button>
    </div>
  </div>
</div>

<div class="container">
  <div class="card">
    <h3>汇率 / 参数</h3>
    <div class="grid">
      <div class="field small">
        <div class="label">Mastercard JPY/U（每 10000 JPY）</div>
        <input class="input" />
      </div>
      <div class="field small">
        <div class="label">Mastercard JPY/R（每 10000 JPY）</div>
        <input class="input" />
      </div>
      <div class="field small">
        <div class="label">Alipay JPY/R（每 10000 JPY）</div>
        <input class="input" />
      </div>
      <div class="field small">
        <div class="label">Wechat JPY/R（每 10000 JPY）</div>
        <input class="input" />
      </div>
    </div>
  </div>
</div>

<script>
async function loadAvatar(){
  const img=document.getElementById("avatarImg");
  const files=["avatar.png","avatar.jpg","profile.png","icon.png"];
  for(const f of files){
    const t=new Image();
    t.src=f;
    await new Promise(r=>t.onload=t.onerror=r);
    if(t.complete && t.naturalWidth){
      img.src=f;
      img.style.display="block";
      document.querySelector(".fallback").style.display="none";
      break;
    }
  }
}
loadAvatar();
</script>
</body>
</html>
