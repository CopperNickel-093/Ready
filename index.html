<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ready 助手 · by Copper Nickel</title>

<style>
:root{
  --bg:#0b1020;--bg2:#070a14;
  --card:rgba(18,26,51,.92);
  --text:#e8ecff;--muted:#a9b2d6;
  --line:rgba(255,255,255,.10);
  --ok:#1fd074;--bad:#ff3b3b;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Arial;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
}
.container{max-width:1080px;margin:0 auto;padding:12px}

/* ===== Top Bar ===== */
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(11,16,32,.8);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1080px;margin:0 auto;
  padding:10px 12px;
  display:flex;justify-content:space-between;align-items:center;
}
.author{display:flex;align-items:center;gap:10px}
.avatar{
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  object-fit:cover;
}
.brand .title{font-weight:900;font-size:15px}
.brand .subtitle{font-size:12px;color:var(--muted)}

/* ===== Card ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:12px;
  margin-top:12px;
}
.card h3{margin:0 0 6px;font-size:14px}

/* ===== Compact Grid ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:8px;
}
.label{font-size:12px;color:var(--muted)}
.input{
  width:100%;
  padding:8px 10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
}

/* ===== Toggle ===== */
.toggle{display:flex;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.toggle button{
  flex:1;border:0;padding:6px 0;font-weight:900;color:#fff;
  background:#444;cursor:pointer;
}
.toggle .yes.active{background:var(--ok)}
.toggle .no.active{background:var(--bad)}
.toggle button:not(.active){opacity:.4}

/* ===== Table ===== */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px;margin-top:8px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
th,td{border:1px solid rgba(255,255,255,.08);padding:8px}
th{position:sticky;top:0;background:#121a33;color:var(--muted)}
td[contenteditable]{background:rgba(255,255,255,.05)}
.min-ok{color:var(--ok);font-weight:900}
.min-bad{color:var(--bad);font-weight:900}
</style>
</head>

<body>

<!-- ===== Top ===== -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="author">
      <img src="./avatar.jpg" class="avatar" alt="Copper Nickel">
      <div class="brand">
        <div class="title">Ready 助手</div>
        <div class="subtitle">by Copper Nickel</div>
      </div>
    </div>
  </div>
</div>

<div class="container">

<!-- ===== Settings ===== -->
<div class="card">
<h3>汇率 / 参数（对齐 Excel V1）</h3>
<div class="grid">
  <div><div class="label">M JPY/U</div><input id="mju" class="input" value="63.9"></div>
  <div><div class="label">M JPY/R</div><input id="mjr" class="input" value="443.49"></div>
  <div><div class="label">Z JPY/R</div><input id="zjr" class="input" value="444.65"></div>
  <div><div class="label">V JPY/R</div><input id="vjr" class="input" value="443.86"></div>

  <div><div class="label">USDT/CNY（买取）</div><input id="usdt" class="input" value="6.97"></div>

  <div>
    <div class="label">提U磨损</div><input id="loss1" class="input" value="0.9986">
    <div class="label">T/C磨损</div><input id="loss2" class="input" value="0.9945">
    <div class="label">USDC/CNY（自动）</div><input id="usdc" class="input" disabled>
  </div>

  <div><div class="label">Cashback %</div><input id="cash" class="input" value="3"></div>
  <div><div class="label">税率 %</div><input id="tax" class="input" value="10"></div>
  <div><div class="label">SELL JPY/R</div><input id="sell" class="input" value="500"></div>
</div>
</div>

<!-- ===== Items ===== -->
<div class="card">
<h3>商品列表</h3>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th><th>平台</th><th>分类</th><th>商品名</th>
<th>JPY</th><th>数量</th><th>优惠%</th><th>免税</th>
<th>最优价</th><th>最优平台</th><th>PROFIT</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>
</div>

</div>

<script>
const tb=document.getElementById("tb");
let items=[{p:"Ready",c:"耳机",n:"示例商品",j:100000,q:1,o:15,t:"NO"}];

function calc(){
  const usdc = document.getElementById("usdt").value /
               document.getElementById("loss1").value /
               document.getElementById("loss2").value;
  document.getElementById("usdc").value=usdc.toFixed(6);

  tb.innerHTML="";
  items.forEach((it,i)=>{
    const pay=(1-it.o/100)*it.j*it.q;
    const base=it.t==="YES"?pay/(1+document.getElementById("tax").value/100):pay;
    const ready=base*(document.getElementById("mju").value/10000)*usdc*(1-document.getElementById("cash").value/100);
    const vx=base*(document.getElementById("vjr").value/10000);
    const zfb=base*(document.getElementById("zjr").value/10000);
    const master=base*(document.getElementById("mjr").value/10000);
    const min=Math.min(ready,vx,zfb,master);
    const label=min===ready?"Ready":min===vx?"VX":min===zfb?"ZFB":"Master";
    const profit=it.j*(document.getElementById("sell").value/10000)-min;

    tb.insertAdjacentHTML("beforeend",`
    <tr>
      <td>${i+1}</td>
      <td contenteditable>${it.p}</td>
      <td contenteditable>${it.c}</td>
      <td contenteditable>${it.n}</td>
      <td contenteditable>${it.j}</td>
      <td contenteditable>${it.q}</td>
      <td contenteditable>${it.o}</td>
      <td>
        <div class="toggle">
          <button class="no ${it.t==="NO"?"active":""}" onclick="it.t='NO';calc()">NO</button>
          <button class="yes ${it.t==="YES"?"active":""}" onclick="it.t='YES';calc()">YES</button>
        </div>
      </td>
      <td class="min-ok">${min.toFixed(2)}</td>
      <td>${label}</td>
      <td class="${profit>=0?"min-ok":"min-bad"}">${profit.toFixed(2)}</td>
    </tr>`);
  });
}
calc();
</script>

</body>
</html>
