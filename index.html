<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Ready 助手 · by Copper Nickel</title>

<style>
:root{
  --bg:#0b1020; --bg2:#070a14;
  --card:rgba(18,26,51,.92);
  --text:#e8ecff; --muted:#a9b2d6;
  --line:rgba(255,255,255,.10);
  --ok:#1fd074; --bad:#ff3b3b;
  --radius:16px;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,"Segoe UI",Arial;
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--text);
}
.container{max-width:1080px;margin:0 auto;padding:14px}

/* ===== Topbar ===== */
.topbar{
  position:sticky;top:0;z-index:10;
  background:rgba(11,16,32,.8);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  max-width:1080px;margin:0 auto;
  padding:12px 14px;
  display:flex;align-items:center;
}
.author{display:flex;align-items:center;gap:10px}
.avatar{
  width:34px;height:34px;border-radius:50%;
  border:1px solid rgba(255,255,255,.2);
  object-fit:cover;
}
.brand .title{font-weight:900;font-size:16px}
.brand .subtitle{font-size:12px;color:var(--muted)}

/* ===== Card ===== */
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:14px;
  margin-top:14px;
}
.card h3{margin:0 0 8px;font-size:14px}

/* ===== Grid ===== */
.grid{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:10px;
}
.field{grid-column:span 4;display:flex;flex-direction:column;gap:6px}
.label{font-size:12px;color:var(--muted)}
.input{
  width:100%;
  padding:9px 10px;
  border-radius:12px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.06);
  color:var(--text);
}

/* ===== Toggle ===== */
.toggle{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.toggle button{
  flex:1;border:0;padding:6px 0;font-weight:900;color:#fff;cursor:pointer;
}
.toggle .no.active{background:var(--bad)}
.toggle .yes.active{background:var(--ok)}
.toggle button:not(.active){opacity:.35;background:#444}

/* ===== Table ===== */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:1100px;font-size:13px}
th,td{border:1px solid rgba(255,255,255,.08);padding:8px}
th{background:#121a33;color:var(--muted);position:sticky;top:0}
td[contenteditable]{background:rgba(255,255,255,.05)}
.min-ok{color:var(--ok);font-weight:900}
.min-bad{color:var(--bad);font-weight:900}

@media (max-width:720px){
  .field{grid-column:span 12}
}
</style>
</head>

<body>

<!-- ===== Top ===== -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="author">
      <img src="./avatar.jpg" class="avatar" alt="Copper Nickel">
      <div class="brand">
        <div class="title">Ready 助手</div>
        <div class="subtitle">by Copper Nickel</div>
      </div>
    </div>
  </div>
</div>

<div class="container">

<!-- ===== Settings ===== -->
<div class="card">
<h3>汇率 / 参数（V1）</h3>
<div class="grid">
  <div class="field"><div class="label">M JPY/U</div><input class="input" id="mju" value="63.9"></div>
  <div class="field"><div class="label">M JPY/R</div><input class="input" id="mjr" value="443.49"></div>
  <div class="field"><div class="label">Z JPY/R</div><input class="input" id="zjr" value="444.65"></div>
  <div class="field"><div class="label">V JPY/R</div><input class="input" id="vjr" value="443.86"></div>

  <div class="field"><div class="label">USDT/CNY（买取）</div><input class="input" id="usdt" value="6.97"></div>
  <div class="field"><div class="label">提U磨损</div><input class="input" id="loss1" value="0.9986"></div>
  <div class="field"><div class="label">T/C磨损</div><input class="input" id="loss2" value="0.9945"></div>
  <div class="field"><div class="label">USDC/CNY（自动）</div><input class="input" id="usdc" disabled></div>

  <div class="field"><div class="label">Cashback %</div><input class="input" id="cash" value="3"></div>
  <div class="field"><div class="label">税率 %</div><input class="input" id="tax" value="10"></div>
  <div class="field"><div class="label">SELL JPY/R</div><input class="input" id="sell" value="500"></div>
</div>
</div>

<!-- ===== Table ===== -->
<div class="card">
<h3>商品列表</h3>
<div class="table-wrap">
<table>
<thead>
<tr>
<th>#</th><th>平台</th><th>分类</th><th>商品名</th>
<th>JPY</th><th>数量</th><th>优惠%</th><th>免税</th>
<th>最优价</th><th>最优平台</th><th>PROFIT</th>
</tr>
</thead>
<tbody id="tb"></tbody>
</table>
</div>
</div>

</div>

<script>
const tb = document.getElementById("tb");

let items = [
  { p:"Ready", c:"耳机", n:"示例商品", j:100000, q:1, o:15, t:"NO" }
];

function calc(){
  const usdtV = Number(usdt.value) || 0;
  const loss1V = Number(loss1.value) || 1;
  const loss2V = Number(loss2.value) || 1;

  const usdcRate = usdtV / loss1V / loss2V;
  document.getElementById("usdc").value = usdcRate.toFixed(6);

  const mjuV = Number(mju.value)||0;
  const mjrV = Number(mjr.value)||0;
  const zjrV = Number(zjr.value)||0;
  const vjrV = Number(vjr.value)||0;
  const cashV = (Number(cash.value)||0)/100;
  const taxV  = (Number(tax.value)||0)/100;
  const sellV = Number(sell.value)||0;

  tb.innerHTML = "";

  items.forEach((it,i)=>{
    const pay  = (1 - (Number(it.o)||0)/100) * (Number(it.j)||0) * (Number(it.q)||1);
    const base = it.t==="YES" ? pay/(1+taxV) : pay;

    const ready  = base*(mjuV/10000)*usdcRate*(1-cashV);
    const vx     = base*(vjrV/10000);
    const zfb    = base*(zjrV/10000);
    const master = base*(mjrV/10000);

    const min = Math.min(ready,vx,zfb,master);
    const label = min===ready?"Ready":min===vx?"VX":min===zfb?"ZFB":"Master";
    const profit = (Number(it.j)||0)*(sellV/10000)-min;

    tb.insertAdjacentHTML("beforeend",`
      <tr>
        <td>${i+1}</td>
        <td contenteditable>${it.p}</td>
        <td contenteditable>${it.c}</td>
        <td contenteditable>${it.n}</td>
        <td contenteditable>${it.j}</td>
        <td contenteditable>${it.q}</td>
        <td contenteditable>${it.o}</td>
        <td>
          <div class="toggle">
            <button class="no ${it.t==="NO"?"active":""}" onclick="it.t='NO';calc()">NO</button>
            <button class="yes ${it.t==="YES"?"active":""}" onclick="it.t='YES';calc()">YES</button>
          </div>
        </td>
        <td class="min-ok">${min.toFixed(2)}</td>
        <td>${label}</td>
        <td class="${profit>=0?"min-ok":"min-bad"}">${profit.toFixed(2)}</td>
      </tr>
    `);
  });
}

calc();
</script>

</body>
</html>
