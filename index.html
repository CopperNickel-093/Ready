<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <title>Excel Web Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
      margin: 16px;
    }
    h2 { margin-bottom: 8px; }
    select {
      padding: 6px 10px;
      margin-bottom: 12px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 6px 8px;
      white-space: nowrap;
    }
    th {
      background: #f5f5f5;
      position: sticky;
      top: 0;
    }
  </style>
</head>
<body>

<h2>Excel 表格展示</h2>

<label>Sheet：</label>
<select id="sheet"></select>

<div id="output">正在加载 Excel…</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.20.3/dist/xlsx.full.min.js"></script>
<script>
fetch('./data.xlsx')
  .then(res => res.arrayBuffer())
  .then(buf => {
    const wb = XLSX.read(buf, { type: 'array' });
    const sheetSelect = document.getElementById('sheet');
    const output = document.getElementById('output');

    wb.SheetNames.forEach((name, i) => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      sheetSelect.appendChild(opt);
    });

    function render(sheetName) {
      const ws = wb.Sheets[sheetName];
      output.innerHTML = XLSX.utils.sheet_to_html(ws);
    }

    sheetSelect.addEventListener('change', e => render(e.target.value));
    render(wb.SheetNames[0]);
  })
 .catch((e) => {
  document.getElementById('output').textContent =
    '加载/解析失败：' + (e && e.message ? e.message : String(e));
  console.error(e);
});

</script>

</body>
</html>
