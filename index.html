<div class="fx-grid">
  <!-- 第1行：4个 -->
  <div class="field fx3">
    <div class="label">M JPY/U（每 10000 JPY = ? USDC）</div>
    <input class="input" id="mJpyPer10kUsdc" type="number" step="0.0001" />
  </div>
  <div class="field fx3">
    <div class="label">M JPY/R（每 10000 JPY = ? RMB）</div>
    <input class="input" id="mJpyPer10kRmb" type="number" step="0.0001" />
  </div>
  <div class="field fx3">
    <div class="label">Z JPY/R（每 10000 JPY = ? RMB）</div>
    <input class="input" id="zJpyPer10kRmb" type="number" step="0.0001" />
  </div>
  <div class="field fx3">
    <div class="label">V JPY/R（每 10000 JPY = ? RMB）</div>
    <input class="input" id="vJpyPer10kRmb" type="number" step="0.0001" />
  </div>

  <!-- 第2行：USDT/CNY + 提U磨损 + T/C磨损 + USDC/CNY 同行 -->
  <div class="field fx3">
    <div class="label">USDT/CNY（买取）</div>
    <input class="input" id="usdtCny" type="number" step="0.0001" />
  </div>
  <div class="field fx3">
    <div class="label">提U磨损</div>
    <input class="input" id="usdtDiv1" type="number" step="0.0001" />
  </div>
  <div class="field fx3">
    <div class="label">T/C磨损</div>
    <input class="input" id="usdtDiv2" type="number" step="0.0001" />
  </div>
  <div class="field fx3">
    <div class="label">USDC/CNY（自动）</div>
    <input class="input" id="usdcCny" type="number" step="0.0001" disabled />
  </div>

  <!-- 第3行：3个（会自动留空一个格） -->
  <div class="field fx3">
    <div class="label">Cashback（%）</div>
    <input class="input" id="cashbackPct" type="number" step="0.01" />
  </div>
  <div class="field fx3">
    <div class="label">税率（%）</div>
    <input class="input" id="taxRatePct" type="number" step="0.01" />
  </div>
  <div class="field fx3">
    <div class="label">SELL JPY/R（每 10000 JPY = ? RMB）</div>
    <input class="input" id="sellJpyPer10kRmb" type="number" step="0.0001" />
  </div>
</div>
